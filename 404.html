<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · OUCB</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F3D2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
:root { --brand: #0F3D2E; --gold: #F2C14E; --mint: #CFE3D8; --on-brand: #FFFFFF; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--brand); color: var(--on-brand); font-family: "Source Serif 4", Georgia, serif; font-size: 17px; line-height: 1.6;
  display: grid; place-items: center; padding: 32px max(16px, env(safe-area-inset-left, 0px)) 32px max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 34rem; display: grid; gap: 20px; justify-items: start; }
svg { width: 72px; height: 72px; }
.dot { fill: var(--gold); }
.letters { fill: currentColor; font-family: "Space Grotesk", Arial, sans-serif; font-weight: 700; font-size: 50px; }
h1 { font-family: "Space Grotesk", Arial, sans-serif; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0; }
p { margin: 0; color: var(--mint); }
a.btn { display: inline-block; margin-top: 8px; background: var(--gold); color: var(--brand); font-family: "Space Grotesk", Arial, sans-serif; font-weight: 700;
  padding: 12px 20px; border-radius: 3px; text-decoration: none; }
a.btn:focus-visible { outline: 2px solid var(--on-brand); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="dot" cx="25" cy="25" r="17.6"/><g class="letters" text-anchor="middle"><text x="75" y="42.5">U</text><text x="25" y="92.5">C</text><text x="75" y="92.5">B</text></g></svg>
  <h1>This page doesn’t exist</h1>
  <p>It may have moved when we rebuilt our website.</p>
  <a class="btn" id="home" href="/">Go to the OUCB homepage</a>
</main>
<script>
  // On a github.io preview the site lives under /<repo>/, so point the link there
  if (location.hostname.endsWith("github.io")) {
    var seg = location.pathname.split("/")[1];
    if (seg) document.getElementById("home").href = "/" + seg + "/";
  }
</script>
</body>
</html>
